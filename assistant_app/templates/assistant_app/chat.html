{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maggie · Chat</title>
  <style>
    :root {
      --bg: #0f172a; --panel: #1e293b; --panel-2: #273449;
      --text: #e2e8f0; --muted: #94a3b8; --accent: #6366f1;
      --patient: #4f46e5; --assistant: #334155; --border: #334155;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); height: 100vh; display: flex; }
    .sidebar { width: 280px; background: var(--panel); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; }
    .sidebar h1 { font-size: 16px; padding: 18px 16px; margin: 0; border-bottom: 1px solid var(--border); }
    .sidebar .actions { padding: 12px; display: flex; gap: 8px; }
    .btn { flex: 1; background: var(--accent); color: white; border: none; padding: 9px;
      border-radius: 8px; cursor: pointer; font-size: 13px; }
    .btn.secondary { background: var(--panel-2); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .sessions { flex: 1; overflow-y: auto; padding: 6px; }
    .session { padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; }
    .session:hover { background: var(--panel-2); }
    .session.active { background: var(--panel-2); border: 1px solid var(--accent); }
    .session .title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .session .meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .badge { font-size: 10px; padding: 1px 6px; border-radius: 6px; background: #475569; }
    .badge.read { background: #64748b; }
    .main { flex: 1; display: flex; flex-direction: column; }
    .topbar { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex;
      justify-content: space-between; align-items: center; }
    .topbar .status { font-size: 12px; color: var(--muted); }
    .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
    .msg { max-width: 70%; padding: 12px 16px; border-radius: 14px; line-height: 1.45; font-size: 14px; }
    .msg.patient { align-self: flex-end; background: var(--patient); }
    .msg.assistant { align-self: flex-start; background: var(--assistant); }
    .msg.system { align-self: center; background: transparent; color: var(--muted); font-size: 12px; }
    .msg .role { font-size: 10px; text-transform: uppercase; opacity: .6; margin-bottom: 4px; letter-spacing: .5px; }
    /* Typing indicator shown while the assistant is responding. */
    .typing .dots { display: inline-flex; gap: 5px; padding: 4px 2px; }
    .typing .dots span { width: 7px; height: 7px; border-radius: 50%; background: currentColor;
      opacity: .35; animation: typing-bounce 1.2s infinite ease-in-out; }
    .typing .dots span:nth-child(2) { animation-delay: .15s; }
    .typing .dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes typing-bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: .35; }
      30% { transform: translateY(-5px); opacity: .9; }
    }
    @media (prefers-reduced-motion: reduce) {
      .typing .dots span { animation: typing-fade 1.2s infinite; }
      @keyframes typing-fade { 0%, 100% { opacity: .35; } 50% { opacity: .9; } }
    }
    .composer { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
    .composer textarea { flex: 1; resize: none; background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-size: 14px; font-family: inherit; }
    .composer button { padding: 0 22px; }
    .notice { font-size: 12px; color: #fbbf24; padding: 6px 20px; }
    .empty { color: var(--muted); margin: auto; text-align: center; }

    /* [TEMP DEBUG] agent-flow trace pane -- remove this block when done. */
    .debug { width: 460px; background: #0b1120; border-left: 1px solid var(--border);
      display: flex; flex-direction: column; }
    .debug .dhead { padding: 12px 16px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; }
    .debug .dhead h2 { font-size: 13px; margin: 0; color: #fbbf24; }
    .debug .dbody { flex: 1; overflow-y: auto; padding: 12px; }
    .debug .placeholder { color: var(--muted); font-size: 12px; }
    .node { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
    .node .nhead { background: #111a2e; padding: 8px 10px; font-size: 12px; font-weight: 600;
      color: #a5b4fc; cursor: pointer; display: flex; justify-content: space-between; }
    .node .nhead .idx { color: var(--muted); font-weight: 400; }
    .node .nbody { padding: 8px 10px; font-size: 11px; }
    .node .label { color: #fbbf24; font-size: 10px; text-transform: uppercase; letter-spacing: .4px; margin: 6px 0 2px; }
    .node pre { margin: 0; white-space: pre-wrap; word-break: break-word; color: #cbd5e1;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; line-height: 1.4; }
    .node.prompt { border-color: #6366f1; }
    .node.prompt .nhead { background: #1e1b4b; color: #c7d2fe; }
    .toggle-btn { background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 4px 8px; font-size: 11px; cursor: pointer; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <h1>Maggie · {{ patient.display_name }}</h1>
    <div class="actions">
      <button class="btn" id="newChat">+ New chat</button>
      <button class="btn secondary" id="endChat">End chat</button>
    </div>
    <div class="sessions" id="sessions"></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div id="convTitle">Loading…</div>
      <div class="status" id="convStatus"></div>
    </div>
    <div class="messages" id="messages"><div class="empty">Select or start a chat.</div></div>
    <div class="notice" id="notice"></div>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Type a message… (try 'I want a check-in')"></textarea>
      <button class="btn" id="send">Send</button>
    </div>
  </main>

  <!-- [TEMP DEBUG] agent-flow trace pane -- remove this whole <aside> when done. -->
  <aside class="debug" id="debugPane">
    <div class="dhead">
      <h2>🛠 Agent flow (debug)</h2>
      <button class="toggle-btn" id="toggleDebug">Hide</button>
    </div>
    <div class="dbody" id="debugBody">
      <div class="placeholder">Send a message to see each node's inputs/outputs
        and the final prompt sent to the LLM.</div>
    </div>
  </aside>

  <script>
    const PATIENT_ID = {{ patient.id }};
    let sessions = [];
    let currentSessionId = null;
    let currentWritable = false;
    let responding = false;

    const $ = (id) => document.getElementById(id);

    async function api(url, opts = {}) {
      const res = await fetch(url, {
        headers: { "Content-Type": "application/json" },
        ...opts,
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || res.statusText);
      }
      return res.json();
    }

    async function loadSessions(selectId) {
      sessions = await api(`/api/patients/${PATIENT_ID}/sessions/`);
      renderSessions();
      const target = selectId || (sessions.find(s => s.writable) || sessions[0] || {}).id;
      if (target) selectSession(target);
    }

    function renderSessions() {
      const el = $("sessions");
      el.innerHTML = "";
      sessions.forEach(s => {
        const div = document.createElement("div");
        div.className = "session" + (s.id === currentSessionId ? " active" : "");
        div.onclick = () => selectSession(s.id);
        div.innerHTML = `
          <div class="title">${escapeHtml(s.title || "New chat")}</div>
          <div class="meta">
            <span class="badge ${s.writable ? "" : "read"}">${s.writable ? "active" : "read-only"}</span>
            ${s.workflow_type}
          </div>`;
        el.appendChild(div);
      });
    }

    async function selectSession(id) {
      currentSessionId = id;
      const data = await api(`/api/sessions/${id}/messages/`);
      currentWritable = data.session.writable;
      $("convTitle").textContent = data.session.title || "New chat";
      $("convStatus").textContent = currentWritable
        ? "Active session"
        : "Read-only · " + (data.session.summary || "ended");
      renderMessages(data.messages);
      renderSessions();
      updateComposer();
    }

    function renderMessages(messages) {
      const el = $("messages");
      el.innerHTML = "";
      if (!messages.length) {
        el.innerHTML = '<div class="empty">No messages yet.</div>';
        return;
      }
      messages.forEach(m => {
        const div = document.createElement("div");
        div.className = "msg " + m.role;
        div.innerHTML = `<div class="role">${m.role}</div>${escapeHtml(m.content)}`;
        el.appendChild(div);
      });
      el.scrollTop = el.scrollHeight;
    }

    function updateComposer() {
      $("input").disabled = !currentWritable || responding;
      $("send").disabled = !currentWritable || responding;
      $("endChat").disabled = !currentWritable || responding;
      $("notice").textContent = currentWritable
        ? ""
        : "This session has ended and is read-only. Start a new chat to continue.";
    }

    async function send() {
      const input = $("input");
      const text = input.value.trim();
      if (!text || !currentSessionId || !currentWritable || responding) return;
      input.value = "";
      const sent = appendMessage("patient", text);
      const typing = showTyping();
      responding = true;
      updateComposer();
      try {
        const resp = await api(`/api/sessions/${currentSessionId}/chat/`, {
          method: "POST",
          body: JSON.stringify({ content: text }),
        });
        typing.remove();
        appendMessage("assistant", resp.assistant_message.content);
        renderDebug(resp.debug);  // [TEMP DEBUG]
        responding = false;
        await loadSessions(currentSessionId);
      } catch (e) {
        // A failed turn is rolled back server-side: drop the unsent bubble and
        // restore the text so the patient can resend it.
        typing.remove();
        sent.remove();
        input.value = text;
        appendMessage("system", "Error: " + e.message);
      } finally {
        responding = false;
        updateComposer();
        if (currentWritable) input.focus();
      }
    }

    function showTyping() {
      const el = $("messages");
      const div = document.createElement("div");
      div.className = "msg assistant typing";
      div.setAttribute("role", "status");
      div.setAttribute("aria-label", "Assistant is responding");
      div.innerHTML = '<div class="role">assistant</div><div class="dots"><span></span><span></span><span></span></div>';
      el.appendChild(div);
      el.scrollTop = el.scrollHeight;
      return div;
    }

    function appendMessage(role, content) {
      const el = $("messages");
      if (el.querySelector(".empty")) el.innerHTML = "";
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.innerHTML = `<div class="role">${role}</div>${escapeHtml(content)}`;
      el.appendChild(div);
      el.scrollTop = el.scrollHeight;
      return div;
    }

    function escapeHtml(s) {
      return (s || "").replace(/[&<>"']/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // [TEMP DEBUG] Render the agent-flow trace + final LLM prompt.
    function renderDebug(debug) {
      const body = document.getElementById("debugBody");
      if (!debug) { body.innerHTML = '<div class="placeholder">No debug data.</div>'; return; }
      const trace = debug.trace || [];
      const pretty = (v) => escapeHtml(JSON.stringify(v, null, 2));
      let html = "";
      trace.forEach((entry, i) => {
        const isResponder = entry.node === "responder_agent";
        html += `
          <div class="node ${isResponder ? "prompt" : ""}">
            <div class="nhead" onclick="this.nextElementSibling.style.display =
              this.nextElementSibling.style.display === 'none' ? 'block' : 'none'">
              <span>${escapeHtml(entry.node)}</span><span class="idx">#${i + 1}</span>
            </div>
            <div class="nbody">
              <div class="label">input</div><pre>${pretty(entry.inputs)}</pre>
              <div class="label">output</div><pre>${pretty(entry.outputs)}</pre>
            </div>
          </div>`;
      });
      const fp = debug.final_prompt || {};
      if (fp.system || fp.user) {
        html += `
          <div class="node prompt">
            <div class="nhead"><span>FINAL PROMPT → LLM</span><span class="idx">responder</span></div>
            <div class="nbody">
              <div class="label">system</div><pre>${escapeHtml(fp.system || "")}</pre>
              <div class="label">user</div><pre>${escapeHtml(fp.user || "")}</pre>
            </div>
          </div>`;
      }
      body.innerHTML = html || '<div class="placeholder">No trace recorded.</div>';
      body.scrollTop = 0;
    }

    document.getElementById("toggleDebug").onclick = () => {
      const pane = document.getElementById("debugPane");
      const body = document.getElementById("debugBody");
      const btn = document.getElementById("toggleDebug");
      if (body.style.display === "none") {
        body.style.display = "block"; pane.style.width = "460px"; btn.textContent = "Hide";
      } else {
        body.style.display = "none"; pane.style.width = "auto"; btn.textContent = "Show";
      }
    };

    $("newChat").onclick = async () => {
      try {
        const s = await api(`/api/patients/${PATIENT_ID}/sessions/new/`, { method: "POST" });
        await loadSessions(s.id);
      } catch (e) {
        appendMessage("system", "Error: " + e.message);
      }
    };
    $("endChat").onclick = async () => {
      if (!currentSessionId) return;
      try {
        await api(`/api/sessions/${currentSessionId}/end/`, { method: "POST" });
        await loadSessions(currentSessionId);
      } catch (e) {
        appendMessage("system", "Error: " + e.message);
      }
    };
    $("send").onclick = send;
    $("input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });

    loadSessions();
  </script>
</body>
</html>
